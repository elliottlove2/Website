<body class="blog">
    <a class="skip-link" href="#main">Skip to content</a>
    <nav aria-label="Main navigation">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="blog.html" aria-current="page">Blog</a></li>
            </ul>
        </div>
    </nav>

    <main id="main" class="blog-page">
        <header class="blog-header">
            <div class="blog-header-inner">
                <h1>Blog</h1>
                <!-- Optional subtitle: add <p class="blog-subtitle">Your subtitle.</p> here. -->
            </div>
        </header>
        <div class="blog-posts">
            <!-- Add complete posts here, newest first. See README.md for the format. -->
            <article class="blog-post" id="reflections-rotations-and-spinors" aria-labelledby="reflections-title">
                <header class="post-header">
                    <h2 id="reflections-title">Reflections, Rotations, and Spinors</h2>
                </header>

                <div class="post-text">
                    <!-- WRITE HERE: opening paragraphs, before the mirrors demo.
                         Use <p> for paragraphs, <h3> for section headings,
                         \( ... \) for inline math, and \[ ... \] for display math.
                         See README.md for copyable examples. -->
                </div>

                <details class="blog-demo" name="reflections-demos" open>
                    <summary>Interactive mirrors</summary>
                    <pin-spin-cat class="blog-visualization" modes="mirrors" mode="mirrors" theme="light" aria-label="Interactive mirrors demo"></pin-spin-cat>
                </details>

                <div class="post-text">
                    <!-- WRITE HERE: text between the mirrors and spin demos. -->
                </div>

                <details class="blog-demo" name="reflections-demos">
                    <summary>Spin and the 720° turn</summary>
                    <pin-spin-cat class="blog-visualization" modes="spin" mode="spin" theme="light" aria-label="Interactive spin demo"></pin-spin-cat>
                </details>

                <div class="post-text">
                    <!-- WRITE HERE: text between the spin and kaleidoscope demos. -->
                </div>

                <details class="blog-demo" name="reflections-demos">
                    <summary>Kaleidoscope</summary>
                    <pin-spin-cat class="blog-visualization" modes="kaleido" mode="kaleido" theme="light" aria-label="Interactive kaleidoscope demo"></pin-spin-cat>
                </details>

                <div class="post-text">
                    <!-- WRITE HERE: closing paragraphs. -->
                    <noscript><p>Enable JavaScript to use the interactive demos and typeset equations.</p></noscript>
                </div>
            </article>
        </div>
    </main>
